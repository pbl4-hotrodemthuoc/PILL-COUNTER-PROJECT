{% extends "pharmacist/layout.html" %}

{% block title %}Đếm Thuốc{% endblock %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row g-3">
        <div class="col-lg-8">
            <div class="card bg-dark border-0 shadow overflow-hidden" style="height: 600px; border-radius: 12px;">
                <img id="serverImage" class="w-100 h-100" style="object-fit: contain; display: none;">
                <div id="waiting" class="d-flex h-100 flex-column align-items-center justify-content-center text-white-50">
                    <div class="spinner-border text-primary mb-3"></div>
                    <h5>Đang kết nối Camera...</h5>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card h-100 border-0 shadow-sm">
                <div class="card-header bg-white p-1 border-bottom-0">
                    <ul class="nav nav-pills nav-fill" id="modeTabs">
                        <li class="nav-item">
                            <button class="nav-link active fw-bold" onclick="setMode('prescription')">
                                <i class="bi bi-receipt"></i> Theo Đơn
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link fw-bold" onclick="setMode('free')">
                                <i class="bi bi-hand-index-thumb"></i> Tự Do
                            </button>
                        </li>
                    </ul>
                </div>

                <div class="card-body d-flex flex-column">
                    
                    <div id="prescription-panel">
                        <div class="mb-3">
                            <label class="small text-muted fw-bold">1. Chọn đơn hàng:</label>
                            <select id="orderSelect" class="form-select">
                                <option value="">-- Đơn chờ xử lý --</option>
                                {% for order in orders %}
                                <option value="{{ order.id }}">
                                    {{ order.ma_don_thuoc }} - {{ order.ten_benh_nhan }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="small text-muted fw-bold">2. Chọn thuốc:</label>
                            <select id="itemSelect" class="form-select" disabled>
                                <option value="" data-qty="0">-- Chọn đơn trước --</option>
                            </select>
                        </div>

                        <div class="alert alert-primary py-2 px-3 mb-0 d-flex justify-content-between">
                            <span>Yêu cầu:</span>
                            <strong id="reqQtyDisplay">0 viên</strong>
                        </div>
                    </div>

                    <div id="free-panel" style="display: none;">
                        <div class="mb-3">
                            <label class="small text-muted fw-bold">Loại thuốc:</label>
                            <select id="freeDrugSelect" class="form-select">
                                <option value="0">-- Chọn thuốc --</option>
                                {% for d in drugs %}
                                <option value="{{ d.id }}">{{ d.ten_thuoc }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="small text-muted fw-bold">Nhập số lượng đếm:</label>
                            <input type="number" id="manualTarget" class="form-control text-center fs-5 font-monospace" value="0">
                        </div>
                    </div>

                    <div class="py-4 mt-auto mb-3 rounded-3 bg-light text-center border">
                        <span class="text-muted small text-uppercase fw-bold">KẾT QUẢ THỰC TẾ</span>
                        <h1 id="count" class="display-1 fw-bold text-dark my-1">0</h1>
                        <span id="status" class="badge bg-secondary px-3 py-2 rounded-pill">Chờ tín hiệu...</span>
                    </div>

                    <div class="d-grid gap-2">
                        <button id="btnReset" class="btn btn-warning fw-bold shadow-sm">
                            <i class="bi bi-unlock-fill"></i> MỞ KHÓA / ĐẾM LẠI
                        </button>
                        <button id="btnSave" class="btn btn-secondary fw-bold py-2" disabled>
                            CHỜ CHỐT KẾT QUẢ...
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<script>
    const socket = io();
    
    // --- UI ELEMENTS ---
    const img = document.getElementById('serverImage');
    const countEl = document.getElementById('count');
    const statusEl = document.getElementById('status');
    const btnSave = document.getElementById('btnSave');
    const btnReset = document.getElementById('btnReset');
    const waiting = document.getElementById('waiting');
    
    const orderSelect = document.getElementById('orderSelect');
    const itemSelect = document.getElementById('itemSelect');
    const reqQtyDisplay = document.getElementById('reqQtyDisplay');
    const manualTarget = document.getElementById('manualTarget');
    
    const presPanel = document.getElementById('prescription-panel');
    const freePanel = document.getElementById('free-panel');
    
    let currentMode = 'prescription';
    let currentImage = "";

    // --- 1. CHUYỂN TAB (THEO ĐƠN / TỰ DO) ---
    window.setMode = function(mode) {
        currentMode = mode;
        socket.emit('reset_counting');
        countEl.innerText = "0";
        setUIState(false);

        if(mode === 'prescription') {
            presPanel.style.display = 'block';
            freePanel.style.display = 'none';
            // Cập nhật lại target từ dropdown đơn thuốc
            triggerItemChange();
        } else {
            presPanel.style.display = 'none';
            freePanel.style.display = 'block';
            // Cập nhật target từ ô nhập tay
            const target = parseInt(manualTarget.value) || 0;
            socket.emit('update_target', { target: target });
        }
    };

    // --- 2. XỬ LÝ CHỌN ĐƠN HÀNG (Load thuốc từ API) ---
    orderSelect.addEventListener('change', function() {
        const orderId = this.value;
        
        // Reset giao diện
        itemSelect.innerHTML = '<option>Đang tải dữ liệu...</option>';
        itemSelect.disabled = true;
        reqQtyDisplay.innerText = "0 viên";
        
        if (!orderId) {
            itemSelect.innerHTML = '<option value="">-- Chọn đơn trước --</option>';
            return;
        }

        console.log("Calling API for Order:", orderId);

        fetch(`/pharmacist/api/get-order-details/${orderId}`)
            .then(res => res.json())
            .then(data => {
                console.log("API Response:", data); // Xem log trên trình duyệt (F12)
                
                if(data.success && data.items.length > 0) {
                    itemSelect.innerHTML = ''; // Xóa hết option cũ
                    
                    // Thêm option mặc định
                    const defaultOpt = document.createElement('option');
                    defaultOpt.text = "-- Chọn thuốc cần đếm --";
                    defaultOpt.value = "";
                    itemSelect.appendChild(defaultOpt);

                    data.items.forEach(item => {
                        const opt = document.createElement('option');
                        opt.value = item.detail_id;
                        opt.dataset.qty = item.req_qty;
                        
                        let label = `${item.drug_name} (Cần: ${item.req_qty})`;
                        if(item.is_done) {
                            label = `✅ ${label} - Xong`;
                            opt.style.color = "green";
                            // Có thể disable hoặc để cho đếm lại tùy ý
                            // opt.disabled = true; 
                        }
                        opt.innerText = label;
                        itemSelect.appendChild(opt);
                    });

                    itemSelect.disabled = false; // Mở khóa dropdown
                    
                    // [TỰ ĐỘNG CHỌN] Chọn thuốc đầu tiên chưa xong (nếu có)
                    const firstPending = Array.from(itemSelect.options).find(o => o.value && !o.disabled);
                    if(firstPending) {
                        itemSelect.value = firstPending.value;
                        triggerItemChange(); // Kích hoạt logic cập nhật số lượng
                    }

                } else {
                    itemSelect.innerHTML = '<option>Không có thuốc trong đơn này</option>';
                }
            })
            .catch(err => {
                console.error("Lỗi tải đơn:", err);
                itemSelect.innerHTML = '<option>Lỗi kết nối!</option>';
            });
    });

    // --- 3. XỬ LÝ KHI CHỌN THUỐC ---
    itemSelect.addEventListener('change', triggerItemChange);

    function triggerItemChange() {
        const opt = itemSelect.options[itemSelect.selectedIndex];
        if(opt && opt.value) {
            const qty = opt.dataset.qty;
            reqQtyDisplay.innerText = `${qty} viên`;
            
            // Gửi số lượng mục tiêu cho AI Server
            socket.emit('update_target', { target: qty });
            socket.emit('reset_counting'); // Mở khóa đếm mới
        } else {
            reqQtyDisplay.innerText = "0 viên";
        }
    }

    // --- 4. CÁC LOGIC KHÁC (GIỮ NGUYÊN) ---
    manualTarget.addEventListener('input', function() {
        if(currentMode === 'free') socket.emit('update_target', { target: parseInt(this.value) || 0 });
    });

    socket.on('ai_result', (data) => {
        waiting.style.display = 'none';
        img.style.display = 'block';
        img.src = data.processed_image;
        currentImage = data.processed_image;
        countEl.innerText = data.count;

        if(data.is_locked) {
            statusEl.className = `badge bg-${data.status_color} px-3 py-2 rounded-pill`;
            statusEl.innerText = "ĐÃ CHỐT: " + data.status_text;
            setUIState(true);
        } else {
            statusEl.innerText = data.status_text;
            statusEl.className = "badge bg-warning text-dark px-3 py-2 rounded-pill";
            if(!btnSave.disabled) setUIState(false);
        }
    });

    function setUIState(isLocked) {
        if(isLocked) {
            btnSave.disabled = false;
            btnSave.className = "btn btn-success w-100 py-2 fw-bold shadow";
            btnSave.innerHTML = '<i class="bi bi-check-lg"></i> LƯU KẾT QUẢ';
            img.style.border = "5px solid #198754";
        } else {
            btnSave.disabled = true;
            btnSave.className = "btn btn-secondary w-100 py-2 fw-bold";
            btnSave.innerText = "CHỜ ỔN ĐỊNH...";
            img.style.border = "none";
        }
    }

    btnReset.addEventListener('click', () => {
        socket.emit('reset_counting');
        setUIState(false);
    });

    btnSave.addEventListener('click', function() {
        if(currentMode === 'prescription') {
            const detailId = itemSelect.value;
            if(!detailId) return alert("Chưa chọn thuốc!");

            fetch('/pharmacist/api/save-result', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    mode: 'prescription',
                    detail_id: detailId,
                    count: countEl.innerText,
                    image: currentImage
                })
            })
            .then(r => r.json())
            .then(data => {
                if(data.success) {
                    alert("✅ " + data.msg);
                    // Trick: Trigger lại change event để reload danh sách thuốc (cập nhật dấu tích xanh)
                    orderSelect.dispatchEvent(new Event('change')); 
                    socket.emit('reset_counting');
                } else {
                    alert("❌ Lỗi: " + data.msg);
                }
            });
        } else {
            alert("Đếm tự do: Xong!");
            socket.emit('reset_counting');
        }
    });
</script>
{% endblock %}
