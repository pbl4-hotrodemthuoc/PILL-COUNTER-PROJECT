{% extends "pharmacist/layout.html" %}

{% block title %}Tạo Đơn Thuốc Mới{% endblock %}

{% block content %}
<style>
    /* --- CSS CHO TRANG TẠO ĐƠN --- */
    .drug-card {
        cursor: pointer;
        transition: all 0.2s ease;
        border: 1px solid var(--border-color);
    }

    .drug-card:hover {
        border-color: var(--primary-blue);
        transform: translateY(-3px);
        box-shadow: var(--shadow-md);
    }

    .drug-card.out-of-stock {
        opacity: 0.6;
        pointer-events: none;
        background-color: var(--gray-100);
    }

    /* --- CLEAN MINIMALIST UI --- */
    .cart-item {
        background-color: transparent;
        border-bottom: 1px solid #eee;
        padding: 10px 0;
        animation: slideInRight 0.3s ease;
    }
    .cart-item:last-child {
        border-bottom: none;
    }
    
    .cart-scroll {
        max-height: 45vh;
        overflow-y: auto;
        padding: 0 10px;
        background-color: white;
    }
    
    .qty-control {
        display: flex;
        align-items: center;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: white;
    }
    .qty-btn {
        width: 24px;
        height: 24px;
        border: none;
        background: transparent;
        color: #555;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        cursor: pointer;
    }
    .qty-btn:hover { background-color: #f8f9fa; color: black; }
    .qty-input {
        width: 60px; /* Increased from 30px */
        text-align: center;
        border: none;
        border-left: 1px solid #eee;
        border-right: 1px solid #eee;
        background: transparent;
        font-weight: 500;
        font-size: 0.95rem;
        padding: 0 5px;
        height: 24px;
    }
</style>

<div class="row g-4 h-100">
    <div class="col-lg-7 col-xl-8">
        <div class="card shadow-sm h-100 border-0">
            <div class="card-header bg-white border-bottom py-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="d-flex align-items-center">
                        <a href="{{ url_for('pharmacist.order_list') }}"
                            class="btn btn-light btn-sm me-2 rounded-circle shadow-sm text-primary"
                            title="Quay lại danh sách đơn"
                            style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;">
                            <i class="bi bi-arrow-left fw-bold"></i>
                        </a>
                        <h5 class="mb-0 text-primary"><i class="bi bi-grid-fill me-2"></i>Kho Thuốc</h5>
                    </div>
                    <div class="text-muted small">Hiển thị kết quả tìm kiếm</div>
                </div>

                <div class="row g-2">
                    <div class="col-md-8">
                        <div class="search-container w-100">
                            <i class="bi bi-search search-icon"></i>
                            <input type="text" id="drugSearchInput" class="search-input form-control"
                                placeholder="Tìm tên thuốc, mã thuốc (VD: Panadol)...">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select class="form-select" id="categoryFilter">
                            <option value="all">Tất cả danh mục</option>
                            <option value="antibiotic">Kháng sinh</option>
                            <option value="painkiller">Giảm đau</option>
                            <option value="vitamin">Vitamin & Khoáng chất</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card-body bg-light">
                <div id="drugGrid" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3">
                    <div class="col-12 text-center py-5 text-muted">
                        <i class="bi bi-search display-4 mb-3 d-block opacity-50"></i>
                        <p>Đang tải danh sách thuốc...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-lg-5 col-xl-4">
        <!-- Removed h-100 to allow shrinking -->
        <div class="card shadow-lg border-0 position-sticky" style="top: 1rem;">
            <div class="card-header bg-primary text-white py-2"> <!-- Reduced padding -->
                <div class="d-flex justify-content-between align-items-center">
                    <h6 class="mb-0"><i class="bi bi-cart3 me-2"></i>Đơn Thuốc Mới</h6>
                    <span class="badge bg-white text-primary rounded-pill small" id="cartItemCount">0 loại</span>
                </div>
            </div>

            <form method="POST" action="{{ url_for('pharmacist.new_order') }}" id="createOrderForm">
                <div class="card-body p-0">

                    <div class="p-2 bg-light border-bottom"> <!-- Reduced padding -->
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-white border-end-0"><i
                                    class="bi bi-person-circle text-primary"></i></span>
                            <input type="text" name="patient_name" class="form-control border-start-0 ps-0"
                                placeholder="Tên bệnh nhân (Khách lẻ)...">
                        </div>
                    </div>

                    <div class="cart-scroll p-2" id="cartItemsArea" style="min-height: 100px; max-height: 40vh;">
                        <!-- Reduced max-height -->
                        <div id="emptyCartMsg" class="text-center py-4 text-muted">
                            <i class="bi bi-basket display-6 d-block mb-2 opacity-25"></i>
                            <p class="mb-0 small">Chưa có thuốc nào</p>
                        </div>
                    </div>

                    <div class="p-2 bg-gray-50 border-top">
                        <div class="mb-2">
                            <input type="text" name="note" class="form-control form-control-sm"
                                placeholder="Ghi chú...">
                        </div>

                        <div class="d-flex align-items-center gap-2">
                            <div class="bg-white border rounded px-2 py-1 flex-shrink-0">
                                <small class="text-muted d-block" style="font-size: 0.7rem; line-height: 1;">Tổng
                                    cộng</small>
                                <strong class="text-primary" id="totalPills">0</strong> <span
                                    class="small text-muted">viên</span>
                            </div>
                            <button type="submit"
                                class="btn btn-success fw-bold flex-grow-1 shadow-sm h-100 d-flex align-items-center justify-content-center">
                                <i class="bi bi-check2-circle me-1"></i> TẠO & ĐẾM
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // --- CONFIG & STATE ---
    const state = {
        cart: [], // Mảng chứa {id, name, code, qty}
        searchResults: [] // Mảng chứa kết quả tìm kiếm từ API
    };

    // --- DOM ELEMENTS ---
    const searchInput = document.getElementById('drugSearchInput');
    const drugGrid = document.getElementById('drugGrid');
    const cartItemsArea = document.getElementById('cartItemsArea');
    const emptyCartMsg = document.getElementById('emptyCartMsg');
    const cartItemCount = document.getElementById('cartItemCount');
    const totalPillsEl = document.getElementById('totalPills');
    const form = document.getElementById('createOrderForm');

    // --- 1. SEARCH FUNCTION (Backend API) ---
    // Tự động tải danh sách thuốc khi vào trang
    document.addEventListener('DOMContentLoaded', () => {
        searchDrugs('');
    });

    let debounceTimer;
    searchInput.addEventListener('input', function () {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => searchDrugs(this.value), 300);
    });

    async function searchDrugs(query, category) {
        if (!category) category = document.getElementById('categoryFilter').value;
        const url = `/pharmacist/api/search-drugs?q=${query}&category=${category}&_t=${new Date().getTime()}`;

        try {
            const response = await fetch(url);
            const drugs = await response.json();
            state.searchResults = drugs;
            renderDrugGrid(drugs);
        } catch (err) {
            console.error('Error fetching drugs:', err);
            drugGrid.innerHTML = `<div class="col-12 text-center text-danger py-5">Lỗi tải dữ liệu thuốc.</div>`;
        }
    }

    // Add event listener for category filter
    document.getElementById('categoryFilter').addEventListener('change', function () {
        searchDrugs(searchInput.value, this.value);
    });

    // --- 2. RENDER CATALOG (LEFT SIDE) ---
    function renderDrugGrid(drugs) {
        drugGrid.innerHTML = '';

        if (drugs.length === 0) {
            drugGrid.innerHTML = `
                <div class="col-12 text-center py-5 text-muted">
                    <i class="bi bi-box-seam display-4 mb-3 d-block opacity-50"></i>
                    <p>Không tìm thấy thuốc phù hợp</p>
                </div>`;
            return;
        }

        drugs.forEach(drug => {
            // Calculate remaining stock based on cart
            const cartItem = state.cart.find(i => i.id == drug.id);
            const inCart = cartItem ? cartItem.qty : 0;
            const realStock = drug.stock !== undefined ? drug.stock : 0;
            const displayStock = realStock - inCart;

            // Logic màu sắc cho chữ số tồn kho
            const stockClass = displayStock < 10 ? 'text-danger' : 'text-success';

            // Logic nhãn trạng thái
            let stockLabel = 'Còn hàng';
            let badgeClass = 'bg-success text-white';
            let isDisabled = '';
            let cardClass = '';

            // INTELLIGENT WARNING LOGIC
            const threshold = drug.warning_threshold !== undefined ? drug.warning_threshold : 0;
            
            if (displayStock <= 0) {
                stockLabel = 'Tạm hết';
                badgeClass = 'bg-secondary text-white';
                isDisabled = 'pointer-events: none; opacity: 0.6;';
                cardClass = 'out-of-stock';
            } else if (displayStock <= threshold) {
                stockLabel = 'Sắp hết';
                badgeClass = 'bg-warning text-dark'; // Orange warning
            }

            const imgUrl = drug.image || '/static/picture/pills/default.png';

            const cardHtml = `
                <div class="col">
                    <div class="card drug-card h-100 ${cardClass}" onclick="addToCart(${drug.id})" style="${isDisabled}">
                        <div class="card-body p-3">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="badge bg-light text-dark border">${drug.code}</span>
                                <span class="badge ${badgeClass} border-0">${stockLabel}</span>
                            </div>
                            <div class="text-center mb-2">
                                <img src="${imgUrl}" style="height: 60px; object-fit: contain;" alt="${drug.name}">
                            </div>
                            <h6 class="card-title text-truncate fw-bold mb-1" title="${drug.name}">${drug.name}</h6>
                            <div class="small text-muted mb-3">Đơn vị: ${drug.unit || 'Viên'}</div>
                            
                            <div class="d-flex justify-content-between align-items-end">
                                <div>
                                    <small class="text-muted d-block">Tồn kho</small>
                                    <span class="fw-bold ${stockClass}">${displayStock}</span> <!-- Hiển thị tồn kho đã trừ -->
                                </div>
                                <button class="btn btn-sm btn-outline-primary rounded-circle btn-icon">
                                    <i class="bi bi-plus-lg"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            drugGrid.innerHTML += cardHtml;
        });
    }

    // --- 3. CART LOGIC (RIGHT SIDE) ---

    window.addToCart = function (id) {
        const drug = state.searchResults.find(d => d.id == id);
        if (!drug) return;

        const realStock = drug.stock || 0;
        const existingItem = state.cart.find(item => item.id == id);
        const currentQty = existingItem ? existingItem.qty : 0;

        if (currentQty >= realStock) {
            alert('Đã hết hàng cho sản phẩm này!');
            return;
        }

        if (existingItem) {
            existingItem.qty += 10;
        } else {
            state.cart.push({
                id: drug.id,
                name: drug.name,
                code: drug.code,
                qty: 10
            });
        }
        renderCart();
    };

    window.updateQty = function (id, change) {
        const item = state.cart.find(i => i.id == id);
        if (!item) return;

        const drug = state.searchResults.find(d => d.id == id);
        const realStock = drug ? (drug.stock || 0) : 9999; // Fallback if not found in search results

        let newQty = item.qty + change;
        if (newQty < 1) newQty = 1;

        if (newQty > realStock) {
            alert(`Kho chỉ còn ${realStock} viên thuốc này.`);
            newQty = realStock;
        }

        item.qty = newQty;
        renderCart();
    };

    window.removeFromCart = function (id) {
        state.cart = state.cart.filter(item => item.id != id);
        renderCart();
    };

    function renderCart() {
        if (state.cart.length === 0) {
            emptyCartMsg.style.display = 'block';
            cartItemsArea.innerHTML = '';
            cartItemsArea.appendChild(emptyCartMsg);
            cartItemCount.textContent = '0 loại';
            totalPillsEl.textContent = '0';
            return;
        }

        emptyCartMsg.style.display = 'none';
        cartItemsArea.innerHTML = '';

        let totalCount = 0;

        state.cart.forEach(item => {
            totalCount += item.qty;
            const itemHtml = `
                <div class="cart-item">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <div class="text-truncate me-2" style="flex: 1;">
                            <div class="fw-bold text-dark text-truncate" style="max-width: 120px; font-size: 0.95rem;">${item.name}</div>
                            <div class="small text-muted" style="font-size: 0.75rem;">${item.code}</div>
                            <input type="hidden" name="drug_ids[]" value="${item.id}">
                        </div>
                        <div class="qty-control">
                            <button type="button" class="qty-btn" onclick="updateQty(${item.id}, -10)">-</button>
                            <input type="number" name="quantities[]" class="qty-input" value="${item.qty}" onchange="updateQtyInput(${item.id}, this.value)">
                            <button type="button" class="qty-btn" onclick="updateQty(${item.id}, 10)">+</button>
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-danger ms-2 px-2 py-1" onclick="removeFromCart(${item.id})" title="Xóa">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                </div>
            `;
            cartItemsArea.insertAdjacentHTML('beforeend', itemHtml);
        });

        cartItemCount.textContent = `${state.cart.length} loại`;
        totalPillsEl.textContent = totalCount;

        // RE-RENDER GRID TO UPDATE STOCK DISPLAY
        renderDrugGrid(state.searchResults);
    }

    window.updateQtyInput = function (id, value) {
        const val = parseInt(value);
        const item = state.cart.find(i => i.id == id);

        const drug = state.searchResults.find(d => d.id == id);
        const realStock = drug ? (drug.stock || 0) : 9999;

        if (item && val > 0) {
            if (val > realStock) {
                alert(`Kho chỉ còn ${realStock} viên thuốc này.`);
                item.qty = realStock;
            } else {
                item.qty = val;
            }
            renderCart();
        }
    }

    // --- 4. SUBMIT VALIDATION ---
    form.addEventListener('submit', function (e) {
        if (state.cart.length === 0) {
            e.preventDefault();
            alert('Giỏ hàng đang trống! Vui lòng chọn thuốc.');
        }
    });

</script>
{% endblock %}
