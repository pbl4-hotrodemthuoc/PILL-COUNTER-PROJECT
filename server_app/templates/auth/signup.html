<!-- File: server_app/templates/auth/signup.html (PHIÊN BẢN ĐÃ BỔ SUNG) -->
{% extends "layout.html" %} <!-- Giả sử bạn có file layout.html làm giao diện chung -->

{% block title %}Đăng ký{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4">Tạo Tài Khoản Mới</h2>
                    
                    <!-- Vị trí hiển thị flash messages -->
                    {% include '_flash_messages.html' %}

                    <form method="POST" action="{{ url_for('auth.signup') }}">
                        <!-- Họ và Tên -->
                        <div class="mb-3">
                            <label for="full_name" class="form-label">Họ và Tên</label>
                            <input type="text" class="form-control" id="full_name" name="full_name" required>
                        </div>
                        
                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Địa chỉ Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        
                        <!-- Tên Đăng Nhập -->
                        <div class="mb-3">
                            <label for="username" class="form-label">Tên đăng nhập</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>

                        <!-- ===== BỔ SUNG: SỐ ĐIỆN THOẠI ===== -->
                        <div class="mb-3">
                            <label for="phone_number" class="form-label">Số Điện Thoại</label>
                            <input type="tel" class="form-control" id="phone_number" name="phone_number" placeholder="Không bắt buộc">
                        </div>

                        <!-- ===== BỔ SUNG: GIỚI TÍNH ===== -->
                        <div class="mb-3">
                            <label for="gender" class="form-label">Giới Tính</label>
                            <select class="form-select" id="gender" name="gender">
                                <option selected disabled>-- Chọn giới tính --</option>
                                <option value="male">Nam</option>
                                <option value="female">Nữ</option>
                                <option value="other">Khác</option>
                            </select>
                        </div>
                        
                        <!-- Mật Khẩu -->
                        <div class="mb-3">
                            <label for="password" class="form-label">Mật khẩu</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Đăng ký</button>
                        </div>
                    </form>
                    <p class="mt-3 text-center">
                        Đã có tài khoản? <a href="{{ url_for('auth.login') }}">Đăng nhập</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
